<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .form-content{
    width: 100% ;
    height: 500px;
    display: flex;
    justify-content: center;
    align-items: center;   
}

.form-content h2{
    text-align: center;
    padding: 20px;
    font-weight: bolder;
    color: orangered;
}

.form-content .form{
    box-shadow: 0 0 5px gray;
    padding: 10px 80px;
    border-radius: 10px;
}

.form-content .form-group{
    padding: 10px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

select{
    height: 25px;
    width: 190px;
    border-radius: 5px;
    margin-left: 30px;
}

label{
    width: 90px;
}

.form-control{
    width: 75%;
    padding: 5px;
    outline: none;
    border: 1px solid gray;
    border-radius: 5px;
    direction: rtl;
}

.form-group-gender{
    margin-left: 10px;
    display: flex;
}

.form-group-gender{
    margin-left: 0;
}

.gender-item{
    margin-left: 20px;
}

.button{
    padding: 10px 10px;
    border-radius: 10px;
}

.button:hover{
    background-color: orangered;
    color: white;
}
    </style>
</head>
<body>
    <div class="form-content">
        <form action="" method="post" class="form">
            <h2>Đăng kí nhập học</h2>
        <div class="form-group">
        <label for="">Họ tên: </label>
        <input type="text" name="" id="" class="form-control" required> <br>
        </div>

        <div class="form-group">
        <label for="">SĐT:</label>
        <input type="text" name="" id="" class="form-control" required>  <br>
        </div>

        <div class="form-group">
        <label for="">Email: </label>
        <input type="text" name="" id="" class="form-control" required> <br>
        </div>
        
        <div class="form-group">
        <label for="">Ngày sinh:</label>
        <input type="date" name="" id="" class="form-control" required> <br>
        </div>

        <div class="form-group">
        Ngành: 
        <select name="" id="">
            <option value="1">IT</option>
            <option value="2">Tester</option>
            <option value="3">Quản trị kinh doanh</option>
            <option value="4">Thiết kế đồ hoạ</option>
        </select><br>
        </div>
        
        <div class="form-group">
        <div class="form-group-gender">
       <label for="">Giới tính: </label>
        <div class="gender">
            <label for="gender"><input  class="gender-item" type="radio" name="gender" id="gender" checked> Nam</label>
            <label for="gender-nu"><input  class="gender-item" type="radio" name="gender" id="gender-nu"> Nữ </label>
            <br>
        </div>
        </div>
        </div>
        
        <hr>
        <div class="form-group">
        <input class="button" type="submit" value="Đăng ký">
        <input class="button" type="reset" value="Nhập lại">
        </div>
        </form>
        </div>
</body>
</html>
